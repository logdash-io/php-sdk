name: Check deployed package

# Installs logdash/php-sdk from Packagist and checks that its logs and metrics reach Logdash, see check-deployed-package.
# CI runs it after each release; run it by hand on any branch to check a version, by default the latest.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The version to check, such as 1.1.0; empty checks the latest
        required: false

jobs:
  check-deployed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./check-deployed-package/run.sh
        env:
          VERSION: ${{ inputs.version }}
          # Sends the logs and metrics: the ingest key of the SDK smoke tests domain
          LOGDASH_API_KEY: ${{ secrets.LOGDASH_API_KEY }}
          # Reads them back: an ldp_ key with logs:read and metrics:read, restricted to that domain
          LOGDASH_PERSONAL_API_KEY: ${{ secrets.LOGDASH_PERSONAL_API_KEY }}
