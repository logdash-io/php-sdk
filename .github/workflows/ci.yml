name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release in progress must finish; a newer merge waits and releases after it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest PHP that composer.json allows, and the newest
        php-version: ["8.1", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - run: composer run-script phpstan
      - run: composer run-script cs
      - run: composer run-script test
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test 'scripts/*.test.ts'

  # The version the merged commits call for; empty when none of them is a feat, fix, perf, or breaking change.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # On its own line, so that version.ts failing fails the job instead of releasing nothing
      - id: next
        run: |
          version=$(node scripts/version.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Tags the merge v<version>, the tag Packagist publishes as that version.
  release:
    needs: [test, version]
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.next }}
    steps:
      - run: gh release create "v$V" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Ask Packagist to read the new tag now
        run: |
          curl -sS --fail-with-body --retry 3 -X POST -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://github.com/logdash-io/php-sdk"}}' \
            "https://packagist.org/api/update-package?username=$PACKAGIST_USERNAME&apiToken=$PACKAGIST_TOKEN"
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}

  # Installs the version just released from Packagist and checks that its logs and metrics reach Logdash.
  check-deployed-package:
    needs: [version, release]
    uses: ./.github/workflows/check-deployed-package.yml
    with:
      version: ${{ needs.version.outputs.next }}
    secrets: inherit
